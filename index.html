<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 RC Car - Media Gallery & Album</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.65);
            --border-color: rgba(56, 189, 248, 0.2);
            --accent-glow: #38bdf8;
            --primary: #6366f1;
            --secondary: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(56, 189, 248, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrapper {
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
        }

        .subtitle span {
            color: var(--accent-glow);
            font-weight: 600;
        }

        .switcher-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .switch-btn {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 14px 35px;
            border-radius: 35px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .switch-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-glow);
        }

        .switch-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent-glow));
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.45);
            transform: translateY(-2px);
        }

        .gallery-section {
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
        }

        .gallery-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--accent-glow);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
        }

        .media-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .media-card:hover {
            transform: translateY(-8px);
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.1);
        }

        /* Collage Stack Layout */
        .collage-wrapper {
            position: relative;
            width: 100%;
            height: 230px;
            padding: 12px 15px 0 15px;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .collage-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .collage-layer {
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .collage-layer.back-2 {
            top: 0;
            left: 5%;
            transform: scale(0.9) rotate(-4deg);
            opacity: 0.5;
            filter: brightness(0.6);
        }

        .collage-layer.back-1 {
            top: 5px;
            left: 5%;
            transform: scale(0.95) rotate(3deg);
            opacity: 0.75;
            filter: brightness(0.8);
        }

        .collage-layer.front {
            top: 10px;
            left: 5%;
            transform: scale(1) rotate(0deg);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .media-card:hover .collage-layer.back-2 {
            transform: scale(0.92) rotate(-7deg) translateY(-4px);
        }
        .media-card:hover .collage-layer.back-1 {
            transform: scale(0.97) rotate(5deg) translateY(-2px);
        }
        .media-card:hover .collage-layer.front {
            transform: scale(1.02);
        }

        .photo-count-badge {
            position: absolute;
            bottom: 15px;
            right: 25px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .no-photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }

        .media-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .media-title {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .media-desc {
            font-size: 0.98rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .media-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent-glow));
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
            align-self: flex-start;
            cursor: pointer;
            border: none;
        }

        .media-link:hover:not(.disabled) {
            filter: brightness(1.15);
            transform: translateY(-2px);
        }

        .media-link.disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.6;
        }

        /* Modal Lightbox styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(15px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .modal-content-img {
            max-width: 85%;
            max-height: 75vh;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            object-fit: contain;
        }

        .modal-content-video {
            width: 80%;
            max-width: 900px;
            height: 500px;
            border-radius: 12px;
            outline: none;
            background: #000;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .modal-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .modal-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .modal-btn:hover {
            background: var(--accent-glow);
            color: #000;
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
        }

        .modal-counter {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .wrapper {
                padding: 20px 15px;
            }
            h1 {
                font-size: 2rem;
            }
            .switch-btn {
                padding: 10px 20px;
                font-size: 0.95rem;
            }
            .modal-content-video {
                width: 95%;
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>Media Gallery & Album</h1>
            <div class="subtitle">ESP32 Smart 4WD RC Car | <span>Photos & Videos Hub</span></div>
        </header>

        <!-- Switcher Buttons -->
        <div class="switcher-container">
            <button id="btnPhotos" class="switch-btn active" onclick="switchTab('photos')">
                <i class="fa-solid fa-images"></i> Photos
            </button>
            <button id="btnVideos" class="switch-btn" onclick="switchTab('videos')">
                <i class="fa-solid fa-video"></i> Videos
            </button>
        </div>

        <!-- Photos Section -->
        <div id="photosSection" class="gallery-section active">
            <h2 class="section-title"><i class="fa-solid fa-camera text-pink-400"></i> Photo Album & Snapshots</h2>
            <div class="grid-container" id="photoGridContainer"></div>
        </div>

        <!-- Videos Section -->
        <div id="videosSection" class="gallery-section">
            <h2 class="section-title"><i class="fa-solid fa-video text-sky-400"></i> Cloud Video Album</h2>
            <div class="grid-container" id="videoGridContainer"></div>
        </div>

        <div class="footer">
            &copy; 2026 ESP32 Smart RC Car Project. Built with passion and advanced engineering.
        </div>
    </div>

    <!-- Media Modal Lightbox -->
    <div id="mediaModal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div id="modalBodyContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <!-- Dynamic Content -->
        </div>
        <div class="modal-controls">
            <button class="modal-btn" onclick="changeMedia(-1)"><i class="fa-solid fa-chevron-left"></i> Prev</button>
            <span class="modal-counter" id="modalCounter">1 / 1</span>
            <button class="modal-btn" onclick="changeMedia(1)">Next <i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <script>
        // Photo Albums Data
        const photoAlbums = [
            {
                title: "ESP32 Wi-Fi Car Chassis",
                description: "First look, chassis build, motor driver configurations, and testing shots.",
                items: [
                    "https://i.ibb.co/d0TYg3WL/IMG-20260721-193311.jpg",
                    "https://i.ibb.co/Rwbp0wR/IMG-20260721-193256.jpg"
                ]
            }
        ];

       // Video Albums Data
       // const videoAlbums = [
       //    {
       //       title: "AI Vision & Test Drive",
       //       description: "Watch how the 4WD RC car navigates using cloud-hosted video streaming.",
       //       items: [
       //           "https://www.youtube.com/embed/AFCERLZ3OVg?list=RDeYA1lyoHodY"
       //       ]
       //   }
       //];

        // Render Grids
        function renderGrid(type) {
            const isPhoto = type === 'photos';
            const container = document.getElementById(isPhoto ? 'photoGridContainer' : 'videoGridContainer');
            const data = isPhoto ? photoAlbums : videoAlbums;
            
            container.innerHTML = '';

            data.forEach((album, albumIndex) => {
                const hasItems = album.items && album.items.length > 0;
                const itemCount = hasItems ? album.items.length : 0;
                
                let coverHTML = '';
                
                if (hasItems) {
                    const firstItem = album.items[0];
                    const secondItem = album.items[1] || firstItem;
                    const thirdItem = album.items[2] || secondItem;

                    let bg1 = isPhoto ? `url('${thirdItem}')` : 'linear-gradient(135deg, #1e293b, #0f172a)';
                    let bg2 = isPhoto ? `url('${secondItem}')` : 'linear-gradient(135deg, #334155, #1e293b)';
                    let bg3 = isPhoto ? `url('${firstItem}')` : 'linear-gradient(135deg, #475569, #334155)';

                    coverHTML = `
                        <div class="collage-wrapper" onclick="openModal('${type}', ${albumIndex}, 0)">
                            <div class="collage-container">
                                ${itemCount > 2 ? `<div class="collage-layer back-2" style="background-image: ${bg1};"></div>` : ''}
                                ${itemCount > 1 ? `<div class="collage-layer back-1" style="background-image: ${bg2};"></div>` : ''}
                                <div class="collage-layer front" style="background-image: ${bg3}; display: flex; align-items: center; justify-content: center;">
                                    ${!isPhoto ? '<i class="fa-solid fa-play" style="font-size: 3rem; color: #38bdf8; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));"></i>' : ''}
                                </div>
                            </div>
                            <div class="photo-count-badge">
                                <i class="fa-solid ${isPhoto ? 'fa-layer-group' : 'fa-film'}"></i> ${itemCount} ${isPhoto ? 'Photo' : 'Video'}${itemCount > 1 ? 's' : ''}
                            </div>
                        </div>
                    `;
                } else {
                    coverHTML = `
                        <div class="collage-wrapper" style="cursor: default;">
                            <div class="no-photo-placeholder">
                                <i class="fa-solid ${isPhoto ? 'fa-image-slash' : 'fa-video-slash'}" style="font-size: 2rem; margin-bottom: 8px;"></i>
                                <span>No ${isPhoto ? 'Images' : 'Videos'} Uploaded</span>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="media-card">
                        ${coverHTML}
                        <div class="media-content">
                            <div>
                                <h3 class="media-title">${album.title}</h3>
                                <p class="media-desc">${album.description}</p>
                            </div>
                            ${hasItems ? `
                                <button onclick="openModal('${type}', ${albumIndex}, 0)" class="media-link">
                                    <i class="fa-solid ${isPhoto ? 'fa-images' : 'fa-play'}"></i> View ${isPhoto ? 'Album' : 'Videos'} (${itemCount})
                                </button>
                            ` : `
                                <button class="media-link disabled" disabled>
                                    <i class="fa-solid fa-lock"></i> No Links Available
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        // Modal Logic & Play Control
        let currentType = 'photos';
        let currentAlbumIdx = 0;
        let currentItemIdx = 0;

        function stopAllVideos() {
            // Modal එකේ ඇති වීඩියෝ නැවතීම
            const modalVideo = document.getElementById('modalVideo');
            if (modalVideo) {
                modalVideo.pause();
                modalVideo.currentTime = 0;
            }

            // පිටුවේ වෙනත් යම් වීඩියෝ අංග පැවතුනහොත් ඒ සියල්ල නැවතීම
            const allVideos = document.querySelectorAll('video');
            allVideos.forEach(vid => {
                vid.pause();
            });
        }

        function openModal(type, albumIndex, itemIndex) {
            stopAllVideos(); // නව වීඩියෝවක් ඇරීමට පෙර පරණ ඒවා නවත්වයි
            const data = type === 'photos' ? photoAlbums : videoAlbums;
            if (!data[albumIndex].items.length) return;

            currentType = type;
            currentAlbumIdx = albumIndex;
            currentItemIdx = itemIndex;

            updateModalContent();
            document.getElementById('mediaModal').style.display = 'flex';
        }

        function closeModal() {
            stopAllVideos(); // Modal එක close කරද්දී auto pause/stop වේ
            document.getElementById('mediaModal').style.display = 'none';
        }

        function changeMedia(direction) {
            stopAllVideos(); // Next හෝ Prev මාරු වන විට කලින් එක pause වේ
            const data = currentType === 'photos' ? photoAlbums : videoAlbums;
            const album = data[currentAlbumIdx];
            
            currentItemIdx += direction;
            if (currentItemIdx < 0) {
                currentItemIdx = album.items.length - 1;
            } else if (currentItemIdx >= album.items.length) {
                currentItemIdx = 0;
            }

            updateModalContent();
        }

        function updateModalContent() {
            const data = currentType === 'photos' ? photoAlbums : videoAlbums;
            const album = data[currentAlbumIdx];
            const url = album.items[currentItemIdx];
            const container = document.getElementById('modalBodyContainer');

            if (currentType === 'photos') {
                container.innerHTML = `<img class="modal-content-img" id="modalImg" src="${url}">`;
            } else {
                container.innerHTML = `
                    <video class="modal-content-video" id="modalVideo" controls autoplay>
                        <source src="${url}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
                // එකක් play වෙද්දී අනික් සියල්ල auto pause වන event listener එකක් එක් කිරීම
                const newVid = document.getElementById('modalVideo');
                if (newVid) {
                    newVid.addEventListener('play', function() {
                        const allVideos = document.querySelectorAll('video');
                        allVideos.forEach(v => {
                            if (v !== newVid) v.pause();
                        });
                    });
                }
            }

            document.getElementById('modalCounter').innerText = `${currentItemIdx + 1} / ${album.items.length}`;
        }

        // Close when clicking background or pressing Back/Escape
        window.onclick = function(event) {
            const modal = document.getElementById('mediaModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // Tab Switcher Logic
        function switchTab(tab) {
            stopAllVideos(); // ටැබ් මාරු කරද්දී සියලු වීඩියෝ නවතී
            const btnPhotos = document.getElementById('btnPhotos');
            const btnVideos = document.getElementById('btnVideos');
            const photosSection = document.getElementById('photosSection');
            const videosSection = document.getElementById('videosSection');

            if (tab === 'photos') {
                btnPhotos.classList.add('active');
                btnVideos.classList.remove('active');
                photosSection.classList.add('active');
                videosSection.classList.remove('active');
            } else {
                btnVideos.classList.add('active');
                btnPhotos.classList.remove('active');
                videosSection.classList.add('active');
                photosSection.classList.remove('active');
            }
        }

        // Initialize Grids
        renderGrid('photos');
        renderGrid('videos');
    </script>
</body>
</html>
